services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: argirita
      POSTGRES_PASSWORD: argirita_dev
      POSTGRES_DB: argirita
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U argirita -d argirita']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
