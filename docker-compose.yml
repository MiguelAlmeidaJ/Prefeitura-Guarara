services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_USER: guarara
      POSTGRES_PASSWORD: guarara_dev
      POSTGRES_DB: guarara
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U guarara -d guarara']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
